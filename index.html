<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- React Libraries -->
    <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>
<body>


    <div class="dashboard-container">
        <!-- HEADER -->
        <header class="dashboard-header">
            <div>
                <h1>Developer Dashboard</h1>
                <p>Your personalized development workspace</p>
            </div>
            <div id="react-theme-toggle-root"></div>
        </header>

        <!-- LEFT SIDEBAR -->
        <aside class="left-sidebar">
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Calendar</span>
                </div>
                <div class="card-content" id="calendar-widget">
                    <!-- Calendar will be generated by JS -->
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <i class="fa-brands fa-kaggle"></i>
                    <span>Kaggle Datasets</span>
                </div>
                <div class="card-content scrollable-card-content" id="kaggle-feed">
                     <div class="loading-state">Loading datasets...</div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
             <div class="card">
                <div id="react-stackoverflow-reddit-root"></div>
            </div>
            <div class="card">
                <div id="react-hackernews-devto-root"></div>
            </div>
            <div class="card">
                <div id="react-hackernews-devto-root"></div>
            </div>
        </main>

        <!-- RIGHT SIDEBAR -->
        <aside class="right-sidebar">
            <div class="card">
                <div class="card-header">
                    <i class="fa-brands fa-github"></i>
                    <span>GitHub Repositories</span>
                </div>
                <div class="card-content scrollable-card-content" id="github-repos">
                    <div class="loading-state">Loading repos...</div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <i class="fa-brands fa-python"></i>
                    <span>PyPI Packages</span>
                </div>
                <div class="card-content scrollable-card-content" id="pypi-feed">
                     <div class="loading-state">Loading packages...</div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <i class="fa-brands fa-npm"></i>
                    <span>npm Packages</span>
                </div>
                <div class="card-content scrollable-card-content" id="npm-feed">
                     <div class="loading-state">Loading packages...</div>
                </div>
            </div>
            <!--
            <div class="card">
                <div class="card-header">
                    <i class="fa-brands fa-gitlab"></i>
                    <span>GitLab Projects</span>
                </div>
                <div class="card-content scrollable-card-content" id="gitlab-projects">
                     <div class="loading-state">Loading projects...</div>
                </div>
            </div>
            -->
            <div class="card">
                <div class="card-header">
                    <i class="fa-solid fa-code"></i>
                    <span>Codeforces Stats</span>
                </div>
                <div class="card-content" id="codeforces-stats">
                    <div class="loading-state">Loading stats...</div>
                </div>
            </div>
        </aside>

        <div class="card chatbot-full-width">
            <div id="react-chatbot-root"></div>
        </div>
    </div>

    <script src="js/app.js" type="module"></script>
    <script src="js/react-loader.js" type="text/babel"></script>
    <script src="js/react-loader-news.js" type="text/babel"></script>
    <script src="js/react-loader-chatbot.js" type="text/babel"></script>
    <script src="js/react-loader-theme.js" type="text/babel"></script>
</body>
</html>
